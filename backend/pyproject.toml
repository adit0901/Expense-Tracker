[project]
name = "fintrack-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.4",
    "psycopg[binary]>=3.3.8",
    "pydantic[email]>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "alembic>=1.20.1",
    "structlog>=26.1.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "python-multipart>=0.0.33",
    "filetype>=1.2.0",
    "charset-normalizer>=3.5.2",
    "redis>=5.0.0",
    "arq>=0.26.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.20.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "filetype.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires PostgreSQL"]

[tool.coverage.run]
source = ["app"]
branch = true
