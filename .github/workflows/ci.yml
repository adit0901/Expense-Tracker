name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fintrack" --health-interval 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://fintrack_app:fintrack_app@localhost:5432/fintrack
      MIGRATION_DATABASE_URL: postgresql+psycopg://fintrack:fintrack@localhost:5432/fintrack
      TEST_DATABASE_URL: postgresql+psycopg://fintrack_app:fintrack_app@localhost:5432/fintrack_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://fintrack:fintrack@localhost:5432/fintrack_test
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - name: Prepare database roles
        working-directory: .
        run: PGPASSWORD=fintrack psql -h localhost -U fintrack -d fintrack -v ON_ERROR_STOP=1 -f infrastructure/db/init.sql
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations up/down/up
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Design D14: Playwright against the docker compose stack, on main.
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start stack
        run: |
          docker compose up -d --build --wait db mailpit backend
          docker compose up -d frontend
          for i in $(seq 1 60); do curl -sf http://localhost:5173 >/dev/null && break; sleep 2; done
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        env:
          E2E_EXTERNAL: "1"
          BASE_URL: http://localhost:5173
        run: |
          docker compose logs -f backend > ../.e2e-backend.log 2>&1 &
          npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
